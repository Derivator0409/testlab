name: iOS Release (TestFlight)

# OPCIONÁLIS – valódi aláírt build és TestFlight feltöltés.
# Csak akkor fut, ha kézzel indítod, vagy verzió-taget push-olsz (v1.2.3).
#
# ELŐFELTÉTELEK – GitHub repo Settings > Secrets and variables > Actions:
#   BUILD_CERTIFICATE_BASE64      – Apple Distribution .p12 base64-ben
#   P12_PASSWORD                  – a .p12 jelszava
#   PROVISIONING_PROFILE_BASE64   – .mobileprovision base64-ben
#   KEYCHAIN_PASSWORD             – tetszőleges ideiglenes jelszó a CI keychainhez
#   APPSTORE_API_KEY_ID           – App Store Connect API kulcs ID
#   APPSTORE_API_ISSUER_ID        – App Store Connect issuer ID
#   APPSTORE_API_PRIVATE_KEY      – az .p8 kulcs tartalma
#
# base64 előállítás macOS-en:  base64 -i cert.p12 | pbcopy

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Build & upload to TestFlight
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate iOS platform files if missing
        run: |
          if [ ! -d "ios" ]; then
            flutter create --platforms=ios .
          fi

      # Tanúsítvány + provisioning profile telepítése ideiglenes keychainbe.
      - name: Install signing certificate & profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/cert.p12
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          KEYCHAIN=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      # Az ExportOptions.plist-et verziókezeld az ios/ mappában,
      # vagy hozd létre itt. Állítsd be a saját Team ID / bundle ID értékeidet.
      - name: Build signed IPA
        run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      # App Store Connect API kulcs kiírása és feltöltés.
      - name: Upload to TestFlight
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$APPSTORE_API_PRIVATE_KEY" \
            > ~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8
          xcrun altool --upload-app -f build/ios/ipa/*.ipa -t ios \
            --apiKey "$APPSTORE_API_KEY_ID" \
            --apiIssuer "$APPSTORE_API_ISSUER_ID"
