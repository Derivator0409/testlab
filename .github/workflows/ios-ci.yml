name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Ugyanarra a branch-re/PR-re érkező új push megszakítja a futó buildet.
concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.35.0" # igazítsd a projektedhez, vagy hagyd a channel-t

jobs:
  # 1) Statikus elemzés + unit/widget tesztek — olcsó Linux runneren.
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run unit & widget tests
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  # 2) iOS build aláírás nélkül — csak macOS runneren fut.
  #    Szándékosan NEM függ a tesztektől, hogy a build akkor is
  #    elkészüljön, ha egy teszt épp piros.
  build-ios:
    name: Build iOS (no codesign)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # Ha az ios/ mappa nincs verziókezelve, itt legeneráljuk.
      - name: Generate iOS platform files if missing
        run: |
          if [ ! -d "ios" ]; then
            flutter create --platforms=ios .
          fi

      - name: Build iOS (release, no codesign)
        run: flutter build ios --release --no-codesign

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-unsigned
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: warn

  # 3) Integration tesztek iOS szimulátoron.
  integration-test-ios:
    name: Integration tests (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate iOS platform files if missing
        run: |
          if [ ! -d "ios" ]; then
            flutter create --platforms=ios .
          fi

      # A legújabb elérhető iPhone szimulátort választjuk ki dinamikusan,
      # így nem törik el, ha a runner image-ben változnak a modellek.
      - name: Boot iOS Simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[]
                      | select(.key | test("iOS"))
                      | .value[]
                      | select(.name | startswith("iPhone"))]
                      | last | .udid')
          echo "Booting simulator: $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run integration tests
        run: flutter test integration_test/app_test.dart -d "${{ steps.sim.outputs.udid }}"