name: iOS CI

on:
  # Minden HÉTFŐN 04:00 UTC-kor (a nap/idő a cron-ban állítható).
  schedule:
    - cron: "0 4 * * 1"
  # Kézi indítás gomb az Actions fülön (ilyenkor a változás-ellenőrzést átugorjuk).
  workflow_dispatch:

# Ugyanarra a branch-re érkező új futás megszakítja a korábbit.
concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.35.0" # igazítsd a projektedhez, vagy hagyd a channel-t

jobs:
  # 0) Megnézi, volt-e commit az elmúlt 7 napban. A tényleges jobok csak
  #    akkor futnak, ha igen (kézi indításnál mindig futnak).
  check-changes:
    name: Check for recent changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # teljes history kell a git log-hoz

      - name: Detect commits in the last 7 days
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Kézi indítás – mindig fut."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$(git log --since='7 days ago' --oneline)" ]; then
            echo "Volt commit az elmúlt 7 napban – fut."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nem volt változás – kihagyjuk."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  # 1) Statikus elemzés + unit/widget tesztek — olcsó Linux runneren.
  analyze-and-test:
    name: Analyze & Test
    needs: check-changes
    if: needs.check-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run unit & widget tests
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  # 2) iOS build aláírás nélkül — csak macOS runneren fut.
  #    Szándékosan NEM függ a tesztektől, hogy a build akkor is
  #    elkészüljön, ha egy teszt épp piros.
  build-ios:
    name: Build iOS (no codesign)
    needs: check-changes
    if: needs.check-changes.outputs.changed == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # Ha az ios/ mappa nincs verziókezelve, itt legeneráljuk.
      - name: Generate iOS platform files if missing
        run: |
          if [ ! -d "ios" ]; then
            flutter create --platforms=ios .
          fi

      # Szimulátor-build: aláírás nélkül készül, és a Mac Simulatorra
      # a `xcrun simctl install` paranccsal közvetlenül feltehető.
      - name: Build iOS (simulator, no codesign)
        run: flutter build ios --simulator

      # A .app egy mappa; hogy a letöltött artifactban egyben maradjon
      # (ne szétterítve), előbb becsomagoljuk egy zipbe a mappával együtt.
      - name: Package Runner.app
        run: |
          cd build/ios/iphonesimulator
          zip -qry "$GITHUB_WORKSPACE/Runner-simulator.zip" Runner.app

      - name: Upload .app artifact (simulator)
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-simulator
          path: Runner-simulator.zip
          if-no-files-found: warn

  # 3) Integration tesztek iOS szimulátoron.
  #    Az iOS integration teszt CI alatt gyakran instabil, ezért ha elhasal,
  #    NE buktassa el az egész futást (continue-on-error).
  integration-test-ios:
    name: Integration tests (iOS Simulator)
    needs: check-changes
    if: needs.check-changes.outputs.changed == 'true'
    continue-on-error: true
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate iOS platform files if missing
        run: |
          if [ ! -d "ios" ]; then
            flutter create --platforms=ios .
          fi

      # A legújabb elérhető iPhone szimulátort választjuk ki dinamikusan,
      # így nem törik el, ha a runner image-ben változnak a modellek.
      - name: Boot iOS Simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[]
                      | select(.key | test("iOS"))
                      | .value[]
                      | select(.name | startswith("iPhone"))]
                      | last | .udid')
          echo "Booting simulator: $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          # A Simulator GUI elindítása gyakran megoldja a
          # "log reader failed unexpectedly" hibát a CI-ben.
          open -a Simulator --args -CurrentDeviceUDID "$UDID"
          sleep 15
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run integration tests
        run: flutter test integration_test/app_test.dart -d "${{ steps.sim.outputs.udid }}"